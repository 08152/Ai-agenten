<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>FPS ENGINE</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87cfff;font-family:Arial}
#crosshair{position:absolute;top:50%;left:50%;width:10px;height:10px;transform:translate(-50%,-50%);z-index:10;pointer-events:none}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:white;box-shadow:0 0 2px #000}
#crosshair:before{width:2px;height:10px;left:4px}
#crosshair:after{width:10px;height:2px;top:4px}
#coords{position:absolute;bottom:10px;right:10px;color:white;font-size:13px;background:#0008;padding:6px;border-radius:6px;white-space:pre;z-index:20}
#hitmarker{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:38px;color:red;display:none;z-index:20;pointer-events:none}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;background:#0008;padding:12px 20px;border-radius:8px;z-index:30}
</style>
</head>
<body>

<div id="crosshair"></div>
<div id="hitmarker">✖</div>
<div id="coords"></div>
<div id="loading">Lade Waffe...</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87cfff);
scene.fog=new THREE.Fog(0x87cfff,80,500);

const camera=new THREE.PerspectiveCamera(
75,
innerWidth/innerHeight,
0.05,
1000
);

const renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const ambient=new THREE.HemisphereLight(
0xffffff,
0x446644,
1.5
);
scene.add(ambient);

const sun=new THREE.DirectionalLight(0xffffff,1.8);
sun.position.set(100,150,80);
scene.add(sun);

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(5000,5000),
new THREE.MeshStandardMaterial({
color:0x278b27,
roughness:1,
metalness:0
})
);

ground.rotation.x=-Math.PI/2;
ground.position.y=0;
scene.add(ground);

const player=new THREE.Object3D();
scene.add(player);

player.position.set(0,0,5);
player.add(camera);

camera.position.set(0,1.7,0);

let yaw=0;
let pitch=0;
let velocityY=0;
let grounded=true;

const keys=Object.create(null);

window.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;

if(e.code==="Space"){
e.preventDefault();
jump();
}
});

window.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

renderer.domElement.addEventListener("click",()=>{
if(document.pointerLockElement!==renderer.domElement){
renderer.domElement.requestPointerLock();
}
});

document.addEventListener("mousemove",e=>{
if(document.pointerLockElement!==renderer.domElement)return;

yaw-=e.movementX*0.002;
pitch-=e.movementY*0.002;

pitch=Math.max(-1.35,Math.min(1.35,pitch));

player.rotation.y=yaw;
camera.rotation.x=pitch;
});

function jump(){
if(grounded){
velocityY=0.28;
grounded=false;
}
}

const loader=new THREE.GLTFLoader();

let gun=null;
let mixer=null;
let gunActions=[];
let activeAction=null;
let gunReady=false;

loader.load(
"./gun.glb",
gltf=>{

gun=gltf.scene;

gun.traverse(obj=>{
if(obj.isMesh){
obj.frustumCulled=true;

if(obj.material){
obj.material.needsUpdate=false;
}
}
});

camera.add(gun);

gun.position.set(0.42,-0.43,-0.72);
gun.rotation.set(0,Math.PI,0);
gun.scale.setScalar(1);

if(gltf.animations&&gltf.animations.length){

mixer=new THREE.AnimationMixer(gun);

gltf.animations.forEach(clip=>{
const action=mixer.clipAction(clip);
action.setLoop(THREE.LoopOnce,1);
action.clampWhenFinished=true;
gunActions.push({
name:clip.name.toLowerCase(),
action:action,
clip:clip
});
});

}

gunReady=true;
document.getElementById("loading").style.display="none";

},
undefined,
err=>{
console.error("gun.glb konnte nicht geladen werden",err);
document.getElementById("loading").textContent="gun.glb fehlt";
}
);

function playShootAnimation(){

if(!mixer||gunActions.length===0)return;

let selected=
gunActions.find(x=>x.name.includes("shoot"))||
gunActions.find(x=>x.name.includes("fire"))||
gunActions.find(x=>x.name.includes("shot"))||
gunActions.find(x=>x.name.includes("attack"))||
gunActions[0];

if(activeAction){
activeAction.stop();
}

activeAction=selected.action;

activeAction.reset();
activeAction.setLoop(THREE.LoopOnce,1);
activeAction.clampWhenFinished=true;
activeAction.play();
}

const raycaster=new THREE.Raycaster();

let enemies=[];

function createEnemy(x,z){

const body=new THREE.Mesh(
new THREE.BoxGeometry(1,2,1),
new THREE.MeshStandardMaterial({
color:0xdd2222,
roughness:1
})
);

body.position.set(x,1,z);
body.health=100;

scene.add(body);
enemies.push(body);
}

createEnemy(5,-20);
createEnemy(-7,-35);
createEnemy(10,-50);

const shootSound=new Audio("./shoot.mp3");
shootSound.preload="auto";

let lastShot=0;
const fireDelay=110;

window.addEventListener("mousedown",e=>{
if(e.button!==0)return;
if(document.pointerLockElement!==renderer.domElement)return;
shoot();
});

function shoot(){

if(!gunReady)return;

const now=performance.now();

if(now-lastShot<fireDelay)return;

lastShot=now;

playShootAnimation();

shootSound.currentTime=0;
shootSound.play().catch(()=>{});

raycaster.setFromCamera(
new THREE.Vector2(0,0),
camera
);

const hits=raycaster.intersectObjects(enemies,false);

if(hits.length){

const enemy=hits[0].object;

enemy.health-=25;

showHitmarker();

if(enemy.health<=0){

scene.remove(enemy);

const index=enemies.indexOf(enemy);

if(index!==-1){
enemies.splice(index,1);
}

}
}
}

function showHitmarker(){

const marker=document.getElementById("hitmarker");

marker.style.display="block";

clearTimeout(marker._timer);

marker._timer=setTimeout(()=>{
marker.style.display="none";
},80);
}

const clock=new THREE.Clock();

function movement(delta){

const speed=7;

let x=0;
let z=0;

if(keys["w"])z-=1;
if(keys["s"])z+=1;
if(keys["a"])x-=1;
if(keys["d"])x+=1;

if(x!==0||z!==0){

const length=Math.hypot(x,z);

x/=length;
z/=length;

const forward=new THREE.Vector3(
0,0,-1
);

forward.applyAxisAngle(
new THREE.Vector3(0,1,0),
yaw
);

const right=new THREE.Vector3(
1,0,0
);

right.applyAxisAngle(
new THREE.Vector3(0,1,0),
yaw
);

player.position.x+=
(forward.x*z+right.x*x)*speed*delta;

player.position.z+=
(forward.z*z+right.z*x)*speed*delta;
}
}

function gravity(delta){

velocityY-=18*delta;

player.position.y+=velocityY*delta;

if(player.position.y<=0){

player.position.y=0;
velocityY=0;
grounded=true;

}
}

function animate(){

requestAnimationFrame(animate);

const delta=Math.min(clock.getDelta(),0.05);

movement(delta);
gravity(delta);

if(mixer){
mixer.update(delta);
}

document.getElementById("coords").textContent=
"X: "+player.position.x.toFixed(1)+
"\nY: "+player.position.y.toFixed(1)+
"\nZ: "+player.position.z.toFixed(1);

renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

});
</script>
</body>
</html>
